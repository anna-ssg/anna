{{define "header"}}
<!-- If the template for a particular url does not exist(posts.html), setting it to the specific page template data -->
{{ $PageData := index .DeepDataMerge.Pages .PageURL }} {{if eq $PageData nil
}} {{ $PageData = .PageData }} {{end}}

<header>
    <nav>
        <p>
            <a href="/">{{ .DeepDataMerge.Config.SiteTitle }}</a> /
            {{range $_, $map := .DeepDataMerge.Config.Navbar}}
                {{range $key, $value := $map}}
                <a href="/{{ $value }}" style="padding-right: 5px;">{{ $key }}</a>
                {{end}}
            {{end}}
        </p>
    </nav>
</header>
{{end}}
