{{ define "all-tags"}}
{{$PageData := .TemplateData}}
{{ template "head" .}}

<body class="site-body">
    {{template "header" .}}
    <main class="container site-main" role="main">
        <article class="content">
            <section class="prose">
                <header class="page-intro">
                    <p class="eyebrow">Browse tags</p>
                </header>
                <div class="all-tags">
                    {{range .TagNames}}
                    <a href="/tags/{{.}}.html"><code>{{.}}</code></a>
                    {{end}}
                </div>
            </section>
        </article>
    </main>

    {{template "footer" .}}

</body>

</html>

{{ end}}
